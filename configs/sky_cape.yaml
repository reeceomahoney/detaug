name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 8

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  MUJOCO_GL: egl
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  NAME: spatial_goal
  SEED: 1
  ITERS: 40000
workdir: .
setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; mkdir -p ~/sky_workdir/outputs; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q "prior_stretch" flow_planning/policy.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  ENV="--env.type libero --env.suite safelibero_spatial --env.task_onehot 4 --env.target_obs true --env.goal_dim 3 --env.goal_state_start 18 --env.n_action_steps 10 --env.world_count 10"
  RUN=outputs/libero/${NAME}_s$SEED
  echo "##### train $RUN"
  [ -f $RUN/model.safetensors ] || pixi run python scripts/train.py $ENV --repo_id reece-omahoney/$NAME \
    --horizon 0 --num_iters $ITERS --eval_every 0 --balance_tasks true --seed $SEED --run_dir $RUN \
    2>&1 | grep --line-buffered -vE "it/s|Warning|examples/s|^\s*$"
  run() { # CELL TAG ARGS...
    OUT=outputs/cape_goal_s$SEED; mkdir -p $OUT; C=$1; TAG=$2; shift 2; f=$OUT/${TAG}_$C.log
    grep -q "^overall" $f 2>/dev/null && { echo "skip $f"; return; }
    if [[ $C == free_* ]]; then t=${C#free_}; l=I; OBS="--env.obstacle false"; else t=${C%_*}; l=${C#*_}; OBS="--env.obstacle true"; fi
    OMP_NUM_THREADS=2 pixi run python scripts/eval.py $ENV --env.task_id $t --env.level $l $OBS \
      --repo_id reece-omahoney/$NAME --checkpoint $RUN --episodes 5 --cond zero "$@" > $f 2>&1
    echo "$(basename $f .log) $(grep -aE '^overall' $f | tr '\n' ' ')"
  }
  export -f run; export ENV NAME RUN SEED
  { for C in 1_I 1_II 2_I 2_II 3_I 3_II; do echo "$C cape --cape true"; done
    for T in 1 2 3; do echo "free_$T base"; done; } | xargs -P 4 -L 1 bash -c 'run "$@"' _
  rm -rf $SNAP
